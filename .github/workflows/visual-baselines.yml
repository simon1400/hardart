name: Visual baselines

# Renders the linux baselines for the @visual tests on the CI image (decision 010). Run it by hand
# after a deliberate visual change, download the artifact into tests/__screenshots__/ and commit it
# as `visual: …`:
#   gh workflow run visual-baselines.yml
#   gh run download <run id> -n visual-baselines -D tests/__screenshots__

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      # Rewrites every linux baseline; delete them first so changes under the threshold are kept too.
      - name: Render
        env:
          HARDART_RENDER_BASELINES: '1'
        run: |
          find tests/__screenshots__ -name '*-linux.png' -delete
          pnpm exec playwright test --grep @visual --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/__screenshots__/
          retention-days: 7
