name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm check-copy
      - run: pnpm build

      - name: Assert static export
        run: grep -q "hardart" out/index.html

      - run: pnpm check-budget

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      # Budgets from CLAUDE.md §14 on the default build, mobile, simulated throttling (lighthouserc.json).
      - name: Lighthouse
        run: pnpm lighthouse

      # Feature flags are build constants: a second build with all of them on runs their tests.
      - name: Feature flags
        env:
          HARDART_FLAGS: all
        run: |
          pnpm build
          pnpm exec playwright test tests/flags.spec.ts tests/security.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7
