# Nginx config for hardart.cz (decisions 028 and 029). The repo copy is the source of truth; the
# server gets it through nginx/setup-server.sh.
#
#   /etc/nginx/sites-available/hardart.cz      this file, symlinked into sites-enabled
#   /etc/nginx/snippets/hardart-headers.conf   nginx/hardart-headers.conf
#   /opt/hardart/current                       symlink to the live release in /opt/hardart/releases/,
#                                              written by .github/workflows/deploy.yml
#
# Certificates: certbot webroot in /var/www/letsencrypt (renewals use the port 80 block below).
# Check with `nginx -t`, reload with `systemctl reload nginx`, verify with `curl -I https://hardart.cz`.

# HTTP: ACME challenges, everything else to HTTPS on the apex.
server {
    listen 80;
    listen [::]:80;
    server_name hardart.cz www.hardart.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://hardart.cz$request_uri;
    }
}

# HTTPS www: redirect to the apex.
server {
    # nginx 1.24 on the server: http2 is a listen parameter (the http2 directive needs 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hardart.cz;

    ssl_certificate /etc/letsencrypt/live/hardart.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hardart.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://hardart.cz$request_uri;
}

server {
    # nginx 1.24 on the server: http2 is a listen parameter (the http2 directive needs 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hardart.cz;

    ssl_certificate /etc/letsencrypt/live/hardart.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hardart.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Resolved per request, so switching the symlink publishes a release at once.
    root /opt/hardart/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Basic auth, off: the site is public (Dmytro, 2026-09-14). To close it, create the file with
    # `htpasswd -c /etc/nginx/.htpasswd-hardart daniel` and uncomment.
    # auth_basic "hardart";
    # auth_basic_user_file /etc/nginx/.htpasswd-hardart;

    # Compression. The index HTML carries the inline SVGs and the RSC payload (about 570 KB raw).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
        application/xml application/manifest+json;
    # With the ngx_brotli module installed (libnginx-mod-http-brotli-filter):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml
    #     application/xml application/manifest+json;

    error_page 404 /404.html;

    # add_header in a location replaces every add_header of the server block, so each location
    # that sets Cache-Control includes the security headers again.

    # Hashed build output (JS, CSS, fonts): never changes under the same name.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/hardart-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Metadata routes are exported without an extension.
    location = /opengraph-image {
        include /etc/nginx/snippets/hardart-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type image/png;
        try_files $uri =404;
    }

    location = /apple-icon {
        include /etc/nginx/snippets/hardart-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type image/png;
        try_files $uri =404;
    }

    # Unhashed static files (wordmark, client logos, favicon, sitemap). The RSC .txt payloads stay
    # no-cache below, they must match the HTML of the same deploy.
    location ~* \.(?:svg|png|jpg|webp|avif|xml)$ {
        include /etc/nginx/snippets/hardart-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The page has one URL: /index.html is a duplicate for search engines.
    location = /index.html {
        return 301 /;
    }

    # HTML: always revalidated, so a deploy is visible on the next load.
    location / {
        include /etc/nginx/snippets/hardart-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
