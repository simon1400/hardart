# Security headers for hardart.cz (decision 028). Installed as /etc/nginx/snippets/hardart-headers.conf
# and included in every location of nginx/hardart.cz.conf.
#
# The CSP header allows inline scripts; every HTML file also carries a stricter <meta> policy that
# allows them only by hash (scripts/csp.ts), and the browser enforces both. The header adds
# frame-ancestors, which a <meta> policy cannot carry. It must stay equal to headerPolicy() in
# lib/security.ts (tests/security.spec.ts compares them). Replace {{UMAMI_HOST}} with the Umami
# host from Phase 9.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://{{UMAMI_HOST}}; style-src 'self'; img-src 'self' data: https://ik.imagekit.io; media-src 'self' https://ik.imagekit.io; font-src 'self'; connect-src 'self' https://{{UMAMI_HOST}}; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
# One year, only served over HTTPS (this snippet is included in the 443 server only).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
